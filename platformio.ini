; Wineador controller firmware — spec 5.1
; Platform pinned so a rebuild years later matches.
;
; Builds — pick one with  pio run -e <name> -t upload :
;
;   Rev N (bench board, ESP32 DevKit; no longer available: build only)
;   esp32dev     REAL profile, cabinet build.
;   bench        BENCH profile (short timers, spec B3), real sensor readings
;   bench_test   BENCH profile, TEST build (scripted readings + cabinet model)
;   real_test    REAL profile, TEST build (B4 soak)
;   bench_test_boot  as bench_test, plus heat + humidify asked for from boot (B3 tests 11, 12)
;
;   Rev Q (cabinet board, ESP32-S3) — the same five, with a revq prefix:
;   revq  revq_bench  revq_bench_test  revq_real_test  revq_bench_test_boot
;   revq is the only build that may go in the cabinet.
;   STAGE Q1: these compile with every Rev Q pin named, but are NOT for flashing until stage Q2
;   (the RTC's own bus, hardware watchdog, SD power switch and the other Rev Q drivers come then).
;
;   native       Mac-side tests of the control logic:  pio test -e native

[platformio]
default_envs = esp32dev
; Build output in a ".nosync" folder: iCloud Drive syncs ~/Documents but skips
; .nosync folders, so it can't make "name 2" copies that break the build.
workspace_dir = .pio.nosync

[esp32_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.SLAB_USBtoUART
monitor_port = /dev/cu.SLAB_USBtoUART
monitor_filters = time
; Opening the monitor must not reset the board. On the DevKit, EN is pulled low
; (reset) only when RTS is on and DTR is off. With both set to 0 the monitor
; turns DTR off first, leaving RTS on alone for a moment -> reset (seen on the
; bench 2026-11-07). With both at 1 the lines stay on from the moment the port
; opens and RTS is never on by itself. Proved 2026-11-07: open and close twice,
; uptime carried on each time.
monitor_rts = 1
monitor_dtr = 1
; CORE_DEBUG_LEVEL=0: the Arduino core's error messages are compiled out, so a
; bus fault can never hold up the loop while one prints (src/drivers/core_log.h).
build_flags = -Wall -DCORE_DEBUG_LEVEL=0 -DWINEADOR_BOARD_REVN
; Partition table (spec 5.1): min_spiffs — ~1.9 MB per firmware slot, two slots so
; wireless (OTA) updates stay possible; 128 KB flash file storage (logs go to the SD
; card). NVS stays at 0x9000, size 0x5000, as in the default table, so saved settings
; and the reset record survive the switch.
board_build.partitions = min_spiffs.csv
test_ignore = *

[env:esp32dev]
extends = esp32_common

[env:bench]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DWINEADOR_BENCH_PROFILE

[env:bench_test]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DWINEADOR_BENCH_PROFILE -DWINEADOR_TEST_BUILD

; B3 tests 11 and 12: the board asks for heat and humidify from power-up, so a
; watchdog reset or a 12V cut can be tested with nothing typed.
[env:bench_test_boot]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DWINEADOR_BENCH_PROFILE -DWINEADOR_TEST_BUILD -DWINEADOR_BOOT_DEMAND

[env:real_test]
extends = esp32_common
build_flags = ${esp32_common.build_flags} -DWINEADOR_TEST_BUILD

; ------------------------------------------------------------------ Rev Q (spec 5.1)
[revq_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; 8 MB quad flash, 2 MB quad PSRAM (memory type qio_qspi; BOARD_HAS_PSRAM)
board = esp32-s3-devkitc1-n8r2
framework = arduino
; ARDUINO_USB_CDC_ON_BOOT=0: Serial (and the boot messages) on UART0, GPIO43/44 — the J23
; monitor port. The native USB (ARDUINO_USB_MODE=1, USB-Serial-JTAG) is for flashing only:
; a monitor on it can reset the chip (spec 3A.5).
build_flags = -Wall -DCORE_DEBUG_LEVEL=0 -DWINEADOR_BOARD_REVQ -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0
; Two 3.2 MB app slots for OTA; NVS at the same address and size as Rev N (0x9000, 0x5000).
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = time
; J23 has no RTS/DTR wires, so these do nothing there. On the native USB, both off is the state
; that neither resets the chip nor sets download mode — but never monitor on the native USB.
monitor_rts = 0
monitor_dtr = 0
; upload_port: the native USB's /dev/cu.usbmodem… (set at BP2 test 15)
; monitor_port: the J23 cable's port (set when the cable is here)
test_ignore = *

[env:revq]
extends = revq_common

[env:revq_bench]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_BENCH_PROFILE

[env:revq_bench_test]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_BENCH_PROFILE -DWINEADOR_TEST_BUILD

[env:revq_bench_test_boot]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_BENCH_PROFILE -DWINEADOR_TEST_BUILD -DWINEADOR_BOOT_DEMAND

[env:revq_real_test]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_TEST_BUILD

; Mac-side tests of the control logic (no hardware): pio test -e native
; WINEADOR_TEST_BUILD here only so the cabinet model is compiled for its tests.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DWINEADOR_TEST_BUILD

; Wineador controller firmware — spec 5.1
; Platform pinned so a rebuild years later matches.
;
; Builds — pick one with  pio run -e <name> -t upload :
;
;   Rev Q (cabinet board, ESP32-S3; spec 5.1). Rev N, the ESP32 DevKit bench board, is retired:
;   its last firmware is git tag rev-n-last.
;   revq                  REAL profile, the cabinet build: the only build that may go in the cabinet
;   revq_bench            BENCH profile (short timers), real sensor readings
;   revq_bench_test       BENCH profile, TEST build (scripted readings + cabinet model) - THE DEFAULT,
;                         so a plain upload never flashes the cabinet build (spec 5.1)
;   revq_real_test        REAL profile, TEST build (the soak)
;   revq_bench_test_boot  as revq_bench_test, plus heat + humidify asked for from boot (B3 tests 11, 12)
;   revq_rollback_test    B7 test 6 only: the rollback test image (below)
;   Not for flashing until the board arrives (BP2).
;
;   bp2_*        the BP2 bring-up sketches (src/bp2/), one build each
;   native       Mac-side tests of the control logic:  pio test -e native
;   dashboard_sim  the web dashboard served on the Mac with made-up data from the cabinet model
;                  and the real control logic (stage Q5b):  pio run -e dashboard_sim -t exec

[platformio]
default_envs = revq_bench_test
; Build output in a ".nosync" folder: iCloud Drive syncs ~/Documents but skips
; .nosync folders, so it can't make "name 2" copies that break the build.
workspace_dir = .pio.nosync

; ------------------------------------------------------------------ Rev Q (spec 5.1)
[revq_common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
; 8 MB quad flash, 2 MB quad PSRAM (memory type qio_qspi; BOARD_HAS_PSRAM)
board = esp32-s3-devkitc1-n8r2
framework = arduino
; ARDUINO_USB_CDC_ON_BOOT=0: Serial (and the boot messages) on UART0, GPIO43/44 — the J23
; monitor port. The native USB (ARDUINO_USB_MODE=1, USB-Serial-JTAG) is for flashing only:
; a monitor on it can reset the chip (spec 3A.5).
build_flags = -Wall -DCORE_DEBUG_LEVEL=0 -DWINEADOR_BOARD_REVQ -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=0
; Two 3.2 MB app slots for OTA; NVS at 0x9000, size 0x5000 (the address and size Rev N used).
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = time
; J23 has no RTS/DTR wires, so these do nothing there. On the native USB, both off is the state
; that neither resets the chip nor sets download mode — but never monitor on the native USB.
monitor_rts = 0
monitor_dtr = 0
; upload_port: the native USB's /dev/cu.usbmodem… (set at BP2 test 15)
; monitor_port: the J23 cable's port (set when the cable is here)
test_ignore = *
build_src_filter = +<*> -<bp2/> -<sim/>
extra_scripts = post:tools/check_identity.py

[env:revq]
extends = revq_common

[env:revq_bench]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_BENCH_PROFILE

[env:revq_bench_test]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_BENCH_PROFILE -DWINEADOR_TEST_BUILD

[env:revq_bench_test_boot]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_BENCH_PROFILE -DWINEADOR_TEST_BUILD -DWINEADOR_BOOT_DEMAND

[env:revq_real_test]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_TEST_BUILD

; B7 TEST 6 ONLY (spec): the rollback test image. A real-profile cabinet identity, version
; 2.0.0-ROLLBACK-TEST: it holds every load off and stops the hardware watchdog line before it can be
; marked good, so the bootloader rolls back to the image before it. Sent by OTA only; with no older
; image to go back to it holds the loads off and says so. Never the default build.
[env:revq_rollback_test]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_ROLLBACK_TEST

; Mac-side tests of the control logic (no hardware): pio test -e native
; WINEADOR_TEST_BUILD here only so the cabinet model is compiled for its tests.
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra -DWINEADOR_TEST_BUILD

; The web dashboard on the Mac, for review before the board (stage Q5b): the same page file and the
; same lib/core API code as the board, data from the cabinet model run by the real control logic.
; Open http://localhost:8080 (or http://<this Mac's name>.local:8080 on a phone on the same WiFi).
[env:dashboard_sim]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -DWINEADOR_TEST_BUILD -DWINEADOR_DASHBOARD_SIM
build_src_filter = -<*> +<sim/>
test_ignore = *

; ------------------------------------------------------------------ BP2 test sketches (Rev Q)
; One build per BP2 test (spec BP2): pio run -e bp2_<n>_<name> -t upload
; Each compiles only its own sketch, the shared BP2 screen code and the firmware drivers it uses
; (src/drivers/, the same code as the firmware - nothing copied). Not firmware: never for the cabinet.
[bp2_common]
extends = revq_common
build_flags = ${revq_common.build_flags} -DWINEADOR_BP2_SKETCH
bp2_ui = +<bp2/common/bp2_ui.cpp>
bp2_loads = +<bp2/common/bp2_ui.cpp> +<bp2/common/bp2_loads.cpp> +<drivers/outputs.cpp> +<drivers/blowers.cpp> +<drivers/fan.cpp>

; tests 15-17: boot state, nothing driven
[env:bp2_15_boot_state]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<bp2/bp2_15_boot_state.cpp>

; test 18: each output alone
[env:bp2_18_outputs]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_loads} +<bp2/bp2_18_outputs.cpp>

; test 19: the interlock with real loads
[env:bp2_19_interlock]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_loads} +<bp2/bp2_19_interlock.cpp>

; test 20: full load and the 12V rail
[env:bp2_20_full_load]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_loads} +<bp2/bp2_20_full_load.cpp>

; test 21: 3.3V under WiFi
[env:bp2_21_wifi_rails]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<drivers/sd_card.cpp> +<drivers/sd_power.cpp> +<drivers/fan.cpp> +<bp2/bp2_21_wifi_rails.cpp>

; test 22: blower voltage
[env:bp2_22_blowers]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_loads} +<bp2/bp2_22_blowers.cpp>

; test 23: blower overshoot on reset
[env:bp2_23_blower_reset]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<drivers/blowers.cpp> +<bp2/bp2_23_blower_reset.cpp>

; tests 24-25: the hardware watchdog
[env:bp2_24_watchdog]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<drivers/hw_watchdog.cpp> +<bp2/bp2_24_watchdog.cpp>

; test 26: the SD power switch
[env:bp2_26_sd_power]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<drivers/sd_card.cpp> +<drivers/sd_power.cpp> +<bp2/bp2_26_sd_power.cpp>

; test 27: the 12V sense
[env:bp2_27_12v]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<drivers/supply_sense.cpp> +<bp2/bp2_27_12v.cpp>

; test 28: sensors and spare channels
[env:bp2_28_sensors]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<bp2/bp2_28_sensors.cpp>

; test 29: LCD and touch
[env:bp2_29_lcd_touch]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<drivers/lcd.cpp> +<drivers/touch.cpp> +<drivers/backlight.cpp> +<drivers/i2c_bus.cpp> +<bp2/bp2_29_lcd_touch.cpp>

; test 30: the RTC cell
[env:bp2_30_rtc]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_ui} +<drivers/i2c_bus.cpp> +<drivers/time_sync.cpp> +<bp2/bp2_30_rtc.cpp>

; test 35: bulb surge
[env:bp2_35_bulb]
extends = bp2_common
build_src_filter = -<*> ${bp2_common.bp2_loads} +<drivers/sd_card.cpp> +<drivers/sd_power.cpp> +<drivers/hw_watchdog.cpp> +<bp2/bp2_35_bulb.cpp>

